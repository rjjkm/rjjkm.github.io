<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5HNP2Z6BK0"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-5HNP2Z6BK0');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Photo gallery of The Bait Shack — see our shop, bait selection, tackle, and the fishing community we serve in Leominster, MA.">
    <title>Gallery | The Bait Shack — Leominster, MA</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <div class="header-inner">
            <a href="index.html" class="logo">
                <span>🎣</span> The Bait Shack
            </a>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="gallery.html" class="active">Gallery</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>

        <h1>Gallery</h1>
        <p style="margin-bottom: 2rem;">Take a look around The Bait Shack and see what we offer.</p>

        <div class="gallery-container">
            <button class="carousel-button prev" aria-label="Previous image">&#10094;</button>
            <div class="image-carousel">
                <img src="images/baitshack1.webp" alt="The Bait Shack storefront">
                <img src="images/baitshack2.webp" alt="Inside The Bait Shack">
                <img src="images/baitshack3.webp" alt="Fishing tackle and gear">
                <img src="images/baitshack4.webp" alt="Live bait selection">
            </div>
            <button class="carousel-button next" aria-label="Next image">&#10095;</button>
        </div>

    </main>

    <footer>
        <p>&copy; 2026 The Bait Shack — 832 Wachusett St, Leominster, MA 01453</p>
        <p>Open 24 hours a day, 7 days a week | Cash Only</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const carousel = document.querySelector('.image-carousel');
            const prevButton = document.querySelector('.carousel-button.prev');
            const nextButton = document.querySelector('.carousel-button.next');
            const images = document.querySelectorAll('.image-carousel img');

            if (carousel && prevButton && nextButton && images.length > 0) {
                let scrollAmount = images[0].clientWidth * 0.9; 

                nextButton.addEventListener('click', () => {
                    carousel.scrollBy({ left: scrollAmount, behavior: 'smooth' });
                });

                prevButton.addEventListener('click', () => {
                    carousel.scrollBy({ left: -scrollAmount, behavior: 'smooth' });
                });

                function updateScrollAmount() {
                    if (window.innerWidth < 768) {
                        scrollAmount = carousel.clientWidth * 0.95;
                    } else {
                        scrollAmount = carousel.clientWidth * 0.8;
                    }
                }

                window.addEventListener('resize', updateScrollAmount);
                updateScrollAmount();
            }
        });
    </script>

</body>
</html>
